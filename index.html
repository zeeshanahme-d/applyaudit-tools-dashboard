<!doctype html>
<html lang="en" class="h-full antialiased">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Privacy-first Resume, LinkedIn, ATS and Job Match analyzer." />
    <!-- Each page sets its own <title> (React 19 hoists it into <head>). -->
    <!-- The theme before first paint, so a dark-mode visitor never sees a light flash.
         Same key and values as src/store/useTheme.ts. -->
    <script>
        try {
            var theme = localStorage.getItem("theme");
            // Dark unless the visitor chose light, or chose "system" on a light system.
            var dark = theme !== "light" && (theme !== "system" || matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
    </script>
</head>

<body class="min-h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
